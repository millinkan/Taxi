# Fixed prices in CHF per vehicle category, valid in both directions.
fixed_routes:
  - { from: "Liechtenstein", to: "Flughafen Zürich", prices: { standard: 290, van: 380, premium: 420 } }
  - { from: "Liechtenstein", to: "Flughafen St. Gallen-Altenrhein", prices: { standard: 120, van: 160, premium: 180 } }
