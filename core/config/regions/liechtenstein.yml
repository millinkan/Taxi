# Regional template: Liechtenstein and the Rhine valley.
#
# Applied when a firm is onboarded with region "liechtenstein". It gives the
# firm a working price list on day one; the firm then adjusts prices in
# Settings. All prices are STARTING POINTS in CHF and must be confirmed with
# the firm before go-live. Coordinates are approximate centre points; each
# place's radius defines its catchment area for fixed-price matching.

tenant_defaults:
  time_zone: Europe/Vaduz
  currency: CHF
  default_locale: de
  service_center_lat: 47.1410
  service_center_lng: 9.5209
  service_radius_km: 15
  home_area_label: Liechtenstein

# Metered tariffs (Rappen). Used for every trip without a fixed price.
tariffs:
  standard:
    base_fare_cents: 800
    per_km_cents: 380
    per_minute_cents: 0
    minimum_fare_cents: 2000
    night_surcharge_percent: 20
    night_starts_at: "22:00"
    night_ends_at: "06:00"
    rounding_cents: 100
  van:
    base_fare_cents: 1200
    per_km_cents: 480
    per_minute_cents: 0
    minimum_fare_cents: 3000
    night_surcharge_percent: 20
    night_starts_at: "22:00"
    night_ends_at: "06:00"
    rounding_cents: 100
  premium:
    base_fare_cents: 1500
    per_km_cents: 550
    per_minute_cents: 0
    minimum_fare_cents: 4000
    night_surcharge_percent: 20
    night_starts_at: "22:00"
    night_ends_at: "06:00"
    rounding_cents: 100

places:
  # The whole country as one catchment area, for fixed long-distance prices.
  - { name: "Liechtenstein", kind: town, lat: 47.1410, lng: 9.5209, radius_m: 14000, featured: false,
      aliases: "Fürstentum Liechtenstein, FL, Principality of Liechtenstein" }
  - { name: "Vaduz", kind: town, lat: 47.1410, lng: 9.5209, radius_m: 2000, featured: true, aliases: "Vaduz Zentrum, Städtle" }
  - { name: "Schaan", kind: town, lat: 47.1650, lng: 9.5096, radius_m: 2000, featured: true }
  - { name: "Triesen", kind: town, lat: 47.1070, lng: 9.5280, radius_m: 2000, featured: false }
  - { name: "Balzers", kind: town, lat: 47.0667, lng: 9.5025, radius_m: 2000, featured: false }
