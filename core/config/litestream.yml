# Continuous backup of the SQLite databases to S3-compatible object storage
# (Hetzner Object Storage), run by the `litestream` Kamal accessory
# (config/deploy.yml). Every change is shipped within seconds, so a lost
# server costs at most a few seconds of bookings, not a day.
#
# Restore: docs/HOSTING_HETZNER.md, "Restoring". ${VARS} come from the
# accessory's environment.
dbs:
  # Firms, bookings, customers, calls, messages: the business record.
  - path: /rails/storage/production.sqlite3
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: production
        endpoint: ${LITESTREAM_ENDPOINT}
        region: ${LITESTREAM_REGION}
        retention: 720h          # 30 days of point-in-time restore
        snapshot-interval: 24h

  # Scheduled jobs: dispatcher reminders, taxi-now expiry, review requests.
  - path: /rails/storage/production_queue.sqlite3
    replicas:
      - type: s3
        bucket: ${LITESTREAM_BUCKET}
        path: queue
        endpoint: ${LITESTREAM_ENDPOINT}
        region: ${LITESTREAM_REGION}
        retention: 168h
        snapshot-interval: 24h

# Not replicated, rebuilt empty on restore: production_cache.sqlite3 (cache)
# and production_cable.sqlite3 (WebSocket messages kept for one day).
